name: Deploy production

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ${{ fromJSON(vars.ADOB_RUNNER_LABELS_JSON) }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Deploy exact revision
        env:
          ADOB_MODE: VSR
          ADOB_PROJECT_ID: ${{ vars.ADOB_PROJECT_ID }}
          DEPLOY_DIR: ${{ vars.DEPLOY_PATH }}
          SOURCE_DIR: ${{ github.workspace }}
        run: bash scripts/deploy-production.sh "${GITHUB_SHA}"
      - name: Check public health endpoint
        if: vars.PUBLIC_HEALTH_URL != ''
        env:
          PUBLIC_HEALTH_URL: ${{ vars.PUBLIC_HEALTH_URL }}
        run: curl --fail --silent --show-error --retry 12 --retry-delay 5 --retry-all-errors --max-time 20 "${PUBLIC_HEALTH_URL}" >/dev/null
