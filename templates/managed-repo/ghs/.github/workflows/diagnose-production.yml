name: Diagnose production

on:
  workflow_dispatch:
    inputs:
      service:
        description: Docker Compose service name
        required: true
        type: string
      lines:
        description: Maximum log lines
        required: true
        default: "200"
        type: choice
        options: ["100", "200", "500"]
      since:
        description: Log time window
        required: true
        default: "30m"
        type: choice
        options: ["15m", "30m", "2h", "1d"]

permissions:
  contents: read

jobs:
  diagnose:
    uses: b8vipvip/ADOB/.github/workflows/diagnose-via-ssh.yml@__ADOB_SHA__
    with:
      project_name: ${{ vars.ADOB_PROJECT_ID }}
      ssh_host: ${{ vars.VPS_HOST }}
      ssh_port: ${{ vars.VPS_PORT || '22' }}
      ssh_user: ${{ vars.VPS_USER }}
      deploy_path: ${{ vars.DEPLOY_PATH }}
      service: ${{ inputs.service }}
      lines: ${{ inputs.lines }}
      since: ${{ inputs.since }}
    secrets:
      ssh_private_key: ${{ secrets.SSH_PRIVATE_KEY }}
      ssh_host_key: ${{ secrets.SSH_HOST_KEY }}
