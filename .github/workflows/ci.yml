name: CI

on:
  push:
    branches: [main, "agent/**"]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install
      - name: Type-check
        run: npm run check
      - name: Build
        run: npm run build
      - name: Validate plugin manifest
        working-directory: .
        run: node -e "JSON.parse(require('fs').readFileSync('.codex-plugin/plugin.json','utf8')); JSON.parse(require('fs').readFileSync('.mcp.json','utf8'));"
      - name: Validate VSR and GHS project declarations
        working-directory: .
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const projects = JSON.parse(fs.readFileSync('examples/projects.json', 'utf8'));
          const allowed = new Set(['VSR', 'GHS']);
          for (const project of projects) {
            if (!allowed.has(project.deploymentMode)) {
              throw new Error(`Invalid deploymentMode for ${project.id}: ${project.deploymentMode}`);
            }
          }
          NODE
          grep -Fq 'adob_mode:' .github/workflows/deploy-via-ssh.yml
          grep -Fq 'requires adob_mode=GHS' .github/workflows/deploy-via-ssh.yml
          grep -Fq 'VSR — VPS Self-hosted Runner' docs/DEPLOYMENT_MODES.md
          grep -Fq 'GHS — GitHub-hosted SSH' docs/DEPLOYMENT_MODES.md
      - name: Validate installer and template script syntax
        working-directory: .
        run: |
          bash -n installer/*.sh
          bash -n templates/managed-repo/common/scripts/*.sh
          bash -n templates/managed-repo/docker-compose/scripts/*.sh
      - name: Validate workflow YAML
        working-directory: .
        run: |
          ruby -e "require 'yaml'; files = Dir['.github/workflows/*.{yml,yaml}'] + Dir['templates/managed-repo/{common,ghs,vsr}/.github/workflows/*.{yml,yaml}']; files.each { |f| YAML.load_file(f); puts f }"
      - name: Validate onboarding placeholders
        working-directory: .
        run: |
          grep -Fq '__PRODUCTION_BRANCH__' templates/managed-repo/common/.github/workflows/ci.yml
          for file in templates/managed-repo/ghs/.github/workflows/*.yml; do
            grep -Fq '__ADOB_SHA__' "$file"
          done
          if grep -R -Eq 'SSH_PRIVATE_KEY|SSH_HOST_KEY' templates/managed-repo/*/.github/workflows/*.yml; then
            true
          fi
          grep -Fq '.adob-project.json' installer/setup-managed-repo.sh
          grep -Fq 'gh variable set' installer/setup-managed-repo.sh
          grep -Fq 'gh secret set' installer/setup-managed-repo.sh
      - name: Enforce pinned SSH trust policy
        working-directory: .
        run: |
          for file in .github/workflows/*-via-ssh.yml; do
            grep -Fq 'StrictHostKeyChecking yes' "$file"
          done
          if grep -R -Eq 'StrictHostKeyChecking[= ]no|ssh-keyscan' \
            .github/workflows templates/managed-repo installer; then
            echo 'Unsafe SSH trust bypass found' >&2
            exit 1
          fi
      - name: Build container
        run: docker build -t autodevops-bridge:test .
