name: CI

on:
  push:
    branches: [main, "agent/**"]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install
      - name: Type-check
        run: npm run check
      - name: Build
        run: npm run build
      - name: Validate plugin manifest
        working-directory: .
        run: node -e "JSON.parse(require('fs').readFileSync('.codex-plugin/plugin.json','utf8')); JSON.parse(require('fs').readFileSync('.mcp.json','utf8'));"
      - name: Validate VSR and GHS project declarations
        working-directory: .
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const projects = JSON.parse(fs.readFileSync('examples/projects.json', 'utf8'));
          const allowed = new Set(['VSR', 'GHS']);
          for (const project of projects) {
            if (!allowed.has(project.deploymentMode)) {
              throw new Error(`Invalid deploymentMode for ${project.id}: ${project.deploymentMode}`);
            }
          }
          NODE
          grep -Fq 'adob_mode:' .github/workflows/deploy-via-ssh.yml
          grep -Fq 'requires adob_mode=GHS' .github/workflows/deploy-via-ssh.yml
          grep -Fq 'VSR — VPS Self-hosted Runner' docs/DEPLOYMENT_MODES.md
          grep -Fq 'GHS — GitHub-hosted SSH' docs/DEPLOYMENT_MODES.md
      - name: Validate installer syntax
        working-directory: .
        run: bash -n installer/*.sh
      - name: Validate workflow YAML
        working-directory: .
        run: ruby -e "require 'yaml'; Dir['.github/workflows/*.{yml,yaml}'].each { |f| YAML.load_file(f); puts f }"
      - name: Enforce pinned SSH trust policy
        working-directory: .
        run: |
          grep -Fq 'StrictHostKeyChecking yes' .github/workflows/deploy-via-ssh.yml
          if grep -Eq 'StrictHostKeyChecking[= ]no|ssh-keyscan' .github/workflows/deploy-via-ssh.yml; then
            echo 'Unsafe SSH trust bypass found' >&2
            exit 1
          fi
      - name: Build container
        run: docker build -t autodevops-bridge:test .
